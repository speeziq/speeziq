<svg xmlns="http://www.w3.org/2000/svg" width="820" height="112" viewBox="0 0 820 112" font-family="'Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.f{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.b{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s ease-out both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.c{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<rect x="2" y="2" width="816" height="108" rx="12" fill="#0a0a0a" stroke="#6a6a6a" stroke-width="2" stroke-dasharray="8 6"/>
<text class="f" x="30" y="40" font-size="16" font-weight="bold" fill="#ffffff">[!] Disclaimer</text>
<text class="f" style="animation-delay:.3s" x="30" y="68" font-size="14" fill="#cfcfcf">All my work is for educational purposes and authorized security testing only.</text>
<text class="f" style="animation-delay:.6s" x="30" y="92" font-size="14" fill="#cfcfcf">Hack ethically. Respect the law. Stay legal.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
